name: Build PDFCraft Kylin ARM64 glibc 2.31
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container:
      image: ubuntu:20.04
    timeout-minutes: 240
    env:
      DEBIAN_FRONTEND: noninteractive
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Dependencies
        run: |
          set -eux
          test "$(dpkg --print-architecture)" = arm64
          test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.31"
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git bash python3 file binutils build-essential pkg-config libssl-dev libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev dpkg-dev xz-utils
      - uses: actions/checkout@v4
      - name: Download upstream sources
        run: |
          git clone https://github.com/storytold/pdfcraft.git upstream
          cd upstream
          git checkout b503b2e62dfeec5598f344e4e287d9c9cbdb34fa
      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euxo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.95.0
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build and verify binary compatibility
        shell: bash
        run: |
          source "$HOME/.cargo/env"
          bash scripts/build.sh
      - name: Upload files
        uses: actions/upload-artifact@v4
        with:
          name: pdfcraft-kylin-arm64-glibc231
          path: dist/*
          if-no-files-found: error
      - name: Publish release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kylin-v0.21.1-glibc231
          files: dist/*
